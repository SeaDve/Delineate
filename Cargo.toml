[package]
name = "delineate"
version = "0.1.1"
authors = ["Dave Patrick Caberto"]
edition = "2024"

[profile.release]
lto = true

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"] }
anyhow = "1.0"
async-lock = "3.4"
futures-util = { version = "0.3", features = ["io"] }
futures-channel = "0.3"
fuzzy-matcher = "0.3.7"
gettext-rs = { version = "0.7", features = ["gettext-system"] }
gtk = { version = "0.11", package = "gtk4", features = ["gnome_50"] }
gtk_source = { package = "sourceview5", version = "0.11", features = ["v5_10"] }
indexmap = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
webkit = { package = "webkit6", version = "0.6", features = ["v2_42"] }
